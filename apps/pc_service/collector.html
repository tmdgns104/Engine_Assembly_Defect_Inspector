<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC 검사 기록</title>
<style>body{font:16px system-ui;background:#101a29;color:#edf3ff;max-width:1200px;margin:30px auto;padding:15px}section{background:#1a293e;padding:20px;margin:18px 0;border-radius:10px}button,input,select{padding:9px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%}td{padding:9px;border-bottom:1px solid #445}table{width:100%}</style>
<h1>PC 검사 기록 수집</h1><p>Jetson 원기록의 별도 PC 사본 · 현재 장비 READY나 실제 배출을 추정하지 않습니다.</p><section id="status"></section>
<section><input id="product" placeholder="제품 ID"><select id="decision"><option value="">전체 판정</option><option>PASS</option><option>FAIL</option><option>REVIEW</option><option>ERROR</option></select><input type="datetime-local" id="since"><input type="datetime-local" id="until"><button id="search">조회</button><table><tbody id="rows"></tbody></table></section>
<section><h2 id="title">저장 기록 선택</h2><p id="sync"></p><img id="image" alt="선택 기록 이미지"><pre id="detail"></pre></section>
<script>const el=id=>document.getElementById(id);async function get(path){const r=await fetch('/api/v1/'+path);if(!r.ok)throw Error(r.status);return r.json();}async function detail(id){const row=await get('inspections/'+id);el('title').textContent=row.decision+' · '+row.inspection_id;el('detail').textContent=JSON.stringify(row,null,2);const pending=Object.values(row.asset_sync).filter(s=>s!=='ACKED').length;el('sync').textContent=pending?'SYNC_PENDING · 이미지 '+pending+'개 전송 대기':'이미지 수집 완료';const a=row.result?.assets?.find(a=>a.kind==='overlay'&&row.asset_sync[a.asset_id]==='ACKED');if(a)el('image').src='/api/v1/assets/'+a.asset_id;else el('image').removeAttribute('src');}async function refresh(){const s=await get('status');el('status').textContent=JSON.stringify(s);const p=new URLSearchParams();for(const k of ['product','decision','since','until'])if(el(k).value)p.set(k,['since','until'].includes(k)?new Date(el(k).value).toISOString():el(k).value);el('rows').replaceChildren();for(const row of await get('inspections?'+p)){const tr=document.createElement('tr');for(const value of [new Date(row.accepted_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}),row.package.manifest.product_id,row.package.manifest.release_id,row.decision]){const td=document.createElement('td');td.textContent=value;tr.append(td);}const button=document.createElement('button');button.textContent='상세';button.onclick=()=>detail(row.inspection_id);const td=document.createElement('td');td.append(button);tr.append(td);el('rows').append(tr);}}el('search').onclick=refresh;refresh().catch(e=>el('status').textContent='수집 조회 오류 '+e);setInterval(()=>get('status').then(s=>el('status').textContent=JSON.stringify(s)).catch(()=>el('status').textContent='PC Service 연결 끊김'),3000);</script></html>
