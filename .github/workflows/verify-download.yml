name: Verify downloaded runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime-assets-and-install:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r jetson/requirements-runtime.txt
      - run: python -B -X utf8 jetson/install.py --check-only
      - run: python -B -X utf8 -m unittest discover -s notebook/deployment -v
      - run: python -B -X utf8 notebook/deployment/package_candidate.py --output /tmp/engine-runtime.tar.gz
      - run: bash -n jetson/setup.sh
